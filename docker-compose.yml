# Локальний Postgres потрібен для тестів/офлайн-розробки і тд, піднімається тільки з профілем local: docker compose --profile local up -d db-local
# Структуру застосунку створює EF Core з Flenta_Backend: ./scripts/ef.ps1 update

services:
  db-local:
    image: postgres:16
    profiles: ["local"]
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:-flenta}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in .env}
      POSTGRES_DB: ${LOCAL_DB_NAME:-flenta}
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-5433}:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-flenta} -d ${LOCAL_DB_NAME:-flenta}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata_local:
