# База основна живе в Supabase. Локальні сервіси для тестів/CI/демо піднімаються з профілем "local":
#   docker compose --profile local up -d

# запуститься:
#   db-local  локальний Postgres (порт 5433), міграції з db/migrations виконуються автоматично при першому старті
#   db-seed   одноразово заливає тестові дані з db/seed, потім завершується
#   adminer   веб-інтерфейс до бази: http://localhost:8080
#             System: PostgreSQL, Server: db-local, Username/Password/Database з .env (за замовчуванням flenta / flenta_dev / flenta)
# Разом з веб-застосунком: docker compose --profile local --profile app up -d --build  (сайт: http://localhost:3000)

# Скинути все до чистого стану: docker compose --profile local --profile app down -v

services:
  db-local:
    image: postgres:16
    profiles: ["local"]
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:-flenta}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-flenta_dev}
      POSTGRES_DB: ${LOCAL_DB_NAME:-flenta}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${LOCAL_DB_USER:-flenta} -d ${LOCAL_DB_NAME:-flenta}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-seed:
    image: postgres:16
    profiles: ["local"]
    depends_on:
      db-local:
        condition: service_healthy
    environment:
      PGPASSWORD: ${LOCAL_DB_PASSWORD:-flenta_dev}
    volumes:
      - ./db/seed:/seed:ro
    command: ["psql", "-h", "db-local", "-U", "${LOCAL_DB_USER:-flenta}", "-d", "${LOCAL_DB_NAME:-flenta}", "-v", "ON_ERROR_STOP=1", "-f", "/seed/001_seed_dev.sql"]
    restart: "no"

  adminer:
    image: adminer:latest
    profiles: ["local"]
    depends_on:
      - db-local
    environment:
      ADMINER_DEFAULT_SERVER: db-local
    ports:
      - "8080:8080"

  backend:
    build:
      context: ../Flenta_Backend
    profiles: ["app"]
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Cors__AllowedOrigins__0: http://localhost:3000
      Cors__AllowedOrigins__1: http://127.0.0.1:3000
      Banking__Enabled: ${BANKING_ENABLED:-false}
      Banking__ConnectionString: ${BANKING_CONNECTION_STRING:-}
      Banking__CardEncryptionKey: ${BANKING_CARD_ENCRYPTION_KEY:-}
      Didit__Enabled: ${DIDIT_ENABLED:-false}
      Didit__ApiKey: ${DIDIT_API_KEY:-}
      Didit__WebhookSecret: ${DIDIT_WEBHOOK_SECRET:-}
      Didit__WorkflowId: ${DIDIT_WORKFLOW_ID:-}
      Supabase__Enabled: ${SUPABASE_ENABLED:-false}
      Supabase__Url: ${SUPABASE_URL:-}
      Supabase__PublishableKey: ${SUPABASE_PUBLISHABLE_KEY:-}
      Supabase__FrontendUrl: http://localhost:3000

  # Запуск: docker compose --profile local --profile app up -d --build
  frontend:
    build:
      context: ../Flenta_Desktop
      args:
        VITE_CURRENCY_SPREAD: ${VITE_CURRENCY_SPREAD:-0.005}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5080}
    profiles: ["app"]
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_local: