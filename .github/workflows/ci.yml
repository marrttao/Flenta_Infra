name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db-migrations:
    name: Compose config and DB migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose --profile local config -q

      - name: Start local Postgres (applies db/migrations)
        run: docker compose --profile local up -d --wait db-local

      - name: Load seed data
        run: docker compose --profile local run --rm db-seed

      - name: List tables
        run: docker compose --profile local exec -T db-local psql -U flenta -d flenta -c "\dt"

      - name: Logs on failure
        if: failure()
        run: docker compose --profile local logs db-local

      - name: Clean up
        if: always()
        run: docker compose --profile local down -v